services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Definí ADMIN_USERNAME en .env.docker}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definí ADMIN_PASSWORD en .env.docker}
      FRONTEND_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - turnero-data:/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        FRONTEND_API_BASE_URL: http://localhost:3000/api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  turnero-data: